# ============================================================
#  OOPSIE - your settings
#  Change anything here, save, and the next run uses it.
# ============================================================

# --- Which sites to watch -----------------------------------
# Set "enabled: false" to switch a site off.
# You can add any other RSS feed in the same format.
sources:
  - name: HotUKDeals
    country: UK
    currency: "£"
    enabled: true
    feeds:
      - https://www.hotukdeals.com/rss/new
      - https://www.hotukdeals.com/rss/hot

  - name: mydealz
    country: Germany
    currency: "€"
    enabled: true
    feeds:
      - https://www.mydealz.de/rss/new
      - https://www.mydealz.de/rss/hot

  - name: Dealabs
    country: France
    currency: "€"
    enabled: true
    feeds:
      - https://www.dealabs.com/rss/new
      - https://www.dealabs.com/rss/hot

  - name: Chollometro
    country: Spain
    currency: "€"
    enabled: true
    feeds:
      - https://www.chollometro.com/rss/new
      - https://www.chollometro.com/rss/hot

  - name: Pepper Italia
    country: Italy
    currency: "€"
    enabled: true
    feeds:
      - https://www.pepper.it/rss/new
      - https://www.pepper.it/rss/hot

  - name: Pepper NL
    country: Netherlands
    currency: "€"
    enabled: true
    feeds:
      - https://nl.pepper.com/rss/new
      - https://nl.pepper.com/rss/hot

  - name: Pepper PL
    country: Poland
    currency: "zł"
    enabled: true
    feeds:
      - https://www.pepper.pl/rss/new
      - https://www.pepper.pl/rss/hot

  - name: Preisjaeger
    country: Austria
    currency: "€"
    enabled: true
    feeds:
      - https://www.preisjaeger.at/rss/new
      - https://www.preisjaeger.at/rss/hot

  - name: Pepper Sweden
    country: Sweden
    currency: "kr"
    enabled: true
